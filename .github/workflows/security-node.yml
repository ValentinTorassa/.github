name: Security (Node)

# Reusable security checks for a Node repository: npm audit with a dated
# allowlist, plus CodeQL. Defined once here so a runner or action bump is one
# change for every repository. Call it from a job:
#
#   jobs:
#     security:
#       uses: ValentinTorassa/.github/.github/workflows/security-node.yml@<commit SHA>
#       permissions:
#         contents: read
#         security-events: write
#
# Grant security-events: write even with codeql: false. GitHub checks the
# nested jobs' permissions before it evaluates their `if`, and a caller that
# grants only contents: read gets a startup failure. The npm audit job itself
# still runs with contents: read.
#
# npm audit reads package-lock.json and installs nothing. The allowlist lives in
# the calling repository, at .github/npm-audit-allowlist.json (see
# scripts/npm-audit.mjs for its format). CodeQL code scanning needs a public
# repository on this account: private callers pass codeql: false.
on:
  workflow_call:
    inputs:
      audit-level:
        description: Lowest npm advisory severity that fails the run
        type: string
        default: high
      working-directories:
        description: JSON list of directories that hold a package-lock.json
        type: string
        default: '["."]'
      node-version:
        description: Node version for npm audit (ignored when node-version-file is set)
        type: string
        default: "22"
      node-version-file:
        description: Path to a version file such as .nvmrc, for repositories that pin one
        type: string
        default: ""
      codeql:
        description: Run CodeQL (public repositories only)
        type: boolean
        default: true
      codeql-languages:
        description: JSON list of CodeQL languages
        type: string
        default: '["javascript-typescript", "actions"]'
      codeql-config-file:
        description: >-
          Path in the calling repository to a CodeQL config file (for example
          to set paths-ignore). Empty means CodeQL's defaults.
        type: string
        default: ""

permissions: {}

jobs:
  npm-audit:
    name: npm audit (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(inputs.working-directories) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shared scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ValentinTorassa/.github
          path: .vt-shared
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          package-manager-cache: false

      - name: npm audit
        working-directory: ${{ matrix.directory }}
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: node "$GITHUB_WORKSPACE/.vt-shared/scripts/npm-audit.mjs" "--audit-level=$AUDIT_LEVEL"

  codeql:
    if: inputs.codeql
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql-languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ${{ inputs.codeql-config-file }}

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
